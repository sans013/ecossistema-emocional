name: CI - Ecossistema Emocional

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  database-check:
    name: Banco de Dados - Validar script DDL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_password
          POSTGRES_DB: ecossistema_emocional_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Executar database/init.sql (1a execucao)
        env:
          PGPASSWORD: ci_ephemeral_password
        run: psql -h localhost -U postgres -d ecossistema_emocional_ci -v ON_ERROR_STOP=1 -f database/init.sql
      - name: Validar idempotencia (2a execucao)
        env:
          PGPASSWORD: ci_ephemeral_password
        run: psql -h localhost -U postgres -d ecossistema_emocional_ci -v ON_ERROR_STOP=1 -f database/init.sql

  backend-checks:
    name: Backend - Typecheck, Unitarios e Integracao
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_password
          POSTGRES_DB: ecossistema_emocional_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar cliente psql e aplicar database/init.sql
        env:
          PGPASSWORD: ci_ephemeral_password
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d ecossistema_emocional_ci -v ON_ERROR_STOP=1 -f database/init.sql
      - name: Instalar dependencias do backend
        working-directory: backend
        run: npm ci
      - name: Verificar tipos (TypeScript)
        working-directory: backend
        run: npm run typecheck
      - name: Rodar testes unitarios
        working-directory: backend
        run: npm test
      - name: Rodar testes de integracao (PostgreSQL real)
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 3001
          DATABASE_URL: postgresql://postgres:ci_ephemeral_password@localhost:5432/ecossistema_emocional_ci
          JWT_SECRET: segredo_ci_efemero_com_mais_de_32_caracteres_123456
          JWT_EXPIRES_IN: 1h
          BCRYPT_SALT_ROUNDS: 10
          CORS_ORIGIN: http://localhost:8081
        run: npm run test:integration

  mobile-checks:
    name: Mobile - Typecheck e Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias do mobile
        run: npm ci
      - name: Verificar tipos (TypeScript)
        run: npm run typecheck
      - name: Rodar testes unitarios
        run: npm test

  iagen-checks:
    name: IAGen API - Typecheck e Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iagen-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias da IAGen API
        run: npm ci
      - name: Verificar tipos (TypeScript)
        run: npm run typecheck
      - name: Rodar testes unitarios
        run: npm test